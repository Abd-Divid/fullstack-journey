<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <title>صفحتي الدلالية</title>
        <link rel="stylesheet" href="semantic.css">
    </head>
    <body>
        <header>
            <h1>مدونة عبد</h1>
        </header>
        <nav>
            <a href="#">الرئيسية</a> | <a href="#">مقالاتي</a> | <a href="#">عني</a>
            <hr>
        </nav>
        <main class="grid" id="postsGrid">

        </main>
        <hr>
        <footer>
            <p>كل الحقوق محفوظة _ عبد 2026</p>
        </footer>
        <script>
            async function loadPosts() {
                let grid = document.getElementById("postsGrid");
                grid.innerHTML = "<p>عم يحمل ....</p>";
                try{
                   let r = await fetch("https://jsonplaceholder.typicode.com/posts?_limit=9");
                   let posts = await r.json();
                   renderPosts(posts);
                   } catch {
                    grid.innerHTML = "<p>صار خطأ! تأكد من اتصالك بالانترنت ";
                   }
                }
            function renderPosts(posts){
                let grid = document.getElementById("postsGrid");
                grid.innerHTML = posts.map(p => ` 
                <article>
                    <h2>${p.title}</h2>
                    <p>${p.body}</p>
                    </article>
                    `).join("");
            }
            loadPosts()
        </script>
    </body>
</html>
