<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <title>صفحتي الدلالية</title>
        <link rel="stylesheet" href="semantic.css">
    </head>
    <body>
        <header>
            <button id="themeBtn">الوضع الليلي</button>
            <h1>مدونة Abd </h1>
        </header>
        <nav>
            <a href="#">الرئيسية</a> | <a href="#">مقالاتي</a> | <a href="#">عني</a>
            <hr>
        </nav>

        <input type="text" id="searchInput" placeholder="ابحث في المقالات ...">
        
        <main class="grid" id="postsGrid">

        </main>
        <hr>
        <footer>
            <p>كل الحقوق محفوظة _ عبد 2026</p>
        </footer>
        <script>
            if(localStorage.getItem("theme") === "dark"){
                document.body.classList.add("dark");
            }
            let allPosts = [ ];
            let favorites = JSON.parse(localStorage.getItem("favPosts")) || [] ;
            async function loadPosts() {
                let grid = document.getElementById("postsGrid");
                grid.innerHTML = "<p>عم يحمل ....</p>";
                try{
                   let r = await fetch("https://jsonplaceholder.typicode.com/posts?_limit=9");
                    allPosts = await r.json();
                   renderPosts(allPosts);
                   } catch {
                    grid.innerHTML = "<p>صار خطأ! تأكد من اتصالك بالانترنت ";
                   }
                }
            function renderPosts(posts){
                let grid = document.getElementById("postsGrid");
                if (posts.length === 0 ){
                    grid.innerHTML = "<p> لا يوجد نتائج مطابقة </p>";
                    return;
                }
                grid.innerHTML = posts.map(p => ` 
                <article>
                    <h2>${p.title}</h2>
                    <p>${p.body}</p>
                    <button onclick="toggleFavorite(${p.id})">${favorites.includes(p.id) ? "🌟"  : "⭐"}</button>
                    </article>
                    `).join("");
            }
            loadPosts()
            let searchInput = document.getElementById("searchInput");
            searchInput.addEventListener("input" , () => {
                let text = searchInput.value.toLowerCase();
                let filtered = allPosts.filter(p => p.title.toLowerCase().includes(text));
                renderPosts(filtered);
            });

            function toggleFavorite(id){
                if(favorites.includes(id)){
                    favorites = favorites.filter(f => f !== id );
                }else{
                    favorites.push(id);
                }
                localStorage.setItem("favPosts", JSON.stringify(favorites));
                let text = searchInput.value.toLowerCase();
                let filtered = allPosts.filter(p => p.title.toLowerCase().includes(text));
                renderPosts(filtered);
            }
            let themeBtn = document.getElementById("themeBtn");
            themeBtn.addEventListener("click" , () => {
                document.body.classList.toggle("dark");
                localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light" );
            });
        </script>
    </body>
</html>
