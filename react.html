<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <title>أول React</title>
</head>      
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<body>
    <div id="root"></div>
    <script type="text/babel">
        let products = [
            { id: 1, name: "Laptop" , price: 1200 },
            { id: 2, name: "Mouse" , price: 25 },
            { id: 3, name: "keyboard" , price: 45 },
            { id: 4, name: "Headphones" , price: 80 },
            { id: 5, name: "Monitor" , price: 300 },
            { id: 6, name: "Webcam" , price: 60 },
            { id: 7, name: "stand" , price: 10 }
        ];
        function ProductList(){
            return (
                <div>
                    {products.map(p => <ProductCard key={p.id} name={p.name} price={p.price} />)}
                    </div>
            );
        }
        function Welcome(props){
            return <h1>أهلا {props.name} </h1>;
        }

        function ProductCard(props){
            return(
                <div>
                    <h3>{props.name}</h3>
                    <p>${props.price}</p>
                </div>
            );
        }

        function Counter(){
            let [ count, setCount] = React.useState(0);
            return(
                <div>
                    <p> العدد: {count} </p>
                    <button onClick={() => setCount(count + 1)}> + </button>
                    <button onClick={() => setCount(count - 1)}> - </button>
                </div>
            );
        }
        let root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<Counter />);
    </script>
</body>
</html>
