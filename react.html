<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <title>أول Reart</title>
</head>      
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<body>
    <div id="root"></div>
    <script type="text/babel">
        function Welcome(props){
            return <h1>أهلا {props.name} </h1>;
        }

        function ProductCard(props){
            return(
                <div>
                    <h3>{props.name}</h3>
                    <p>${props.price}</p>
                </div>
            );
        }
        let root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(
            <div> 
                <ProductCard name="Mouse" price={25} />
                <ProductCard name="Keyboard" price={45} />
                <ProductCard name="Headphones" price={80} />
            </div>
        );
    </script>
</body>
</html>
