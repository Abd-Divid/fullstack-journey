       <script>
        let nam = "Abd_Divid";
        console.log("Welcome The World");

        function updateColor(){
            if (count>10){
                document.getElementById("counter").style.color ="red";
            }else{
                document.getElementById("counter").style.color ="black";
            }
        }
        function sayHello(){
            document.getElementById("myTitle").textContent ="Welcome in World JavaScript!!"
        }
        let count =0 ;
        let secret = 7 ;
        function increment(){
            count ++ ;
            document.getElementById("counter").textContent = count ;
            updateColor();
        }
        function reset(){
            count = 0 ;
            document.getElementById("counter").textContent = count;
            updateColor();
        }
        function mayns (){
            count --  ;
            document.getElementById("counter").textContent = count ;
            updateColor();
        }
        function jumpTo(){
            let n = document.getElementById("myNumber").value;
            count = Number(n);
            document.getElementById("counter").textContent = count ;
            updateColor();
        }
        function guess(){
            let g = Number(document.getElementById("myNumber").value);
            if (g===secret){
                document.getElementById("hint").textContent = "True ✅ ";
            }else if (g > secret){
                document.getElementById("hint").textContent = "False❌  ,small ";
            }else{
                document.getElementById("hint").textContent = "False❌  ,large  "

            }
        }
        function countToTen(){
            let n = Number(document.getElementById("myNumber").value);
            let text="";
            for(let i = 1; i<=n ; i++){
                text = text + i + " ";
            }
            document.getElementById("numbers").textContent = text ;
        }
        let goals = ["learn HTML","learn CSS","learn JavaScript","you will get Full-Stack"];
        function showGoals(){
            let html = "";
            for (let i = 0 ; i < goals.length ; i++ ){
                html = html + "<li>" + goals[i] + "</li>";
            }
            document.getElementById("goalsList").innerHTML = html ;
        }

        function addGoal(){
            let g = document.getElementById("newGoal").value;
            goals.push(g);
            showGoals();
        }
        let person = { name: "Abd" , age : 20 , city : "Damascus", Job :"The future programming" };

        function showCard(){
            document.getElementById("card").innerHTML = 
            "<h3>" + person.name + "</h3>" +
            "<p>" + person.age + "</p>" +
            "<p>" + person.city + "</p>" +
            "<p>" + person.Job + "</p>" 
        }

        function growUp(){
            person.age = person.age + 1   ;
            showCard();
        }
        
        
        const add = (a, b) => a + b ;

        function doAdd(){
            let x = Number(document.getElementById("num1").value);
            let y = Number(document.getElementById("num2").value);
            let sum = add(x, y);
            document.getElementById("result").textContent = "the result is " + sum ;
        }
        
        const multiply = (a, b) => a * b ;

        function doMultiply(){
            let x = Number(document.getElementById("num1").value);
            let y = Number(document.getElementById("num2").value);
            let product = multiply(x, y);
            document.getElementById("result").textContent = "The result is " + product ;
        }

        let products = [
            { name : "Labtub" , price : 1500 }, 
            { name : "mause" , price : 25 },
            { name : "keypowrd" , price : 45 }
        ];
        function showProducts(){
            let html = products.map(({name , price }) => `<p> ${name} - $${price} ${price > 100 ? "Expensive" : "Good"} </p>`).join("");
            html += `<p><b>sum: $${totalPrice()}</b></p>`;
            document.getElementById("products").innerHTML = html ;
        }

        function totalPrice(){
            let total = 0 ;
            for ( let i = 0 ; i < products.length ;i++){
                total = total + products[i].price;
            }
            return total ;
        }
        
        let tasks = ["learning JavaScript" , "every day I work commit"];
        let saved = localStorage.getItem("myTasks");
        if (saved){
            tasks = JSON.parse(saved);
        }

        function renderTasks(){
            let html = "";
            tasks.forEach((task , i ) => {
                html = html + ` <li> ${task} <button onclick="deleteTask(${i})">❌</button></li>`;
            });
            document.getElementById("taskList").innerHTML = html ; 

        }
        renderTasks();

        function addTask(){
            let t = document.getElementById("taskInput").value;
            if (t === ""){
                return;
            }
            tasks.push(t);
            renderTasks();
            localStorage.setItem("myTasks" , JSON.stringify(tasks));
            document.getElementById("taskInput").value = "" ;
        }
        function deleteTask(i){
            tasks.splice(i , 1);
            renderTasks();
            localStorage.setItem("myTasks" , JSON.stringify(tasks));
        }

        function checkEnter(event){
            if (event.key === "Enter"){
                addTask();
            }
        }

        function startCountdown(){
            let i = Number(document.getElementById("myNumber").value);
            let text = "";
            while (i>0){
                text = text + i + " " ; 
                i-- ; 
            }
            document.getElementById("countdown").textContent = text  + " starting ";
        }

        function searchProducts(){
            let q = document.getElementById("searchInput").value;
            let results = products.filter(p => p.name.includes(q));
            let html = "";
            results.forEach(p  => {
                html += `<p>${p.name} - $${p.price}</p>`;

            });
            document.getElementById("products").innerHTML = html ;
        }

        let names = products.map(p => p.name);
        console.log(names);

        let Age = 20 ; 
        let type = Age >= 18 ? "Man" : "Boy";
        console.log(type);

        let { name, price } = products[0];
        console.log(name);
        console.log(price);

        let copy = [ ...tasks , "A spresd task"];
        console.log(copy);
        console.log(tasks);

        let older = { ...person , age : person.age + 1 };
        console.log(older);
        console.log(person);

        function updateClock(){
            let now = new Date();
            document.getElementById("clock").textContent = now.toLocaleTimeString();
        }
        setInterval(updateClock , 1000);
        updateClock();

        let timer = setInterval(updateClock , 1000);
        clearInterval(timer);

        let sorted = [...products].sort((a, b) => a.price - b.price );
        console.log(sorted);

        function sortCheap(){
            let sorted = [...products].sort((a, b) => a.price - b.price);
            let html = sorted.map(({name , price}) => `<p> ${name} - $${price} ${price > 100 ? "Expensive" : "Cheap"}</p>`).join("");
            document.getElementById("products").innerHTML = html ;
        }
